name: Tweak Cloud Compiler

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          # تنظيف أي بقايا في مسارات النظام الافتراضية
          sudo rm -rf /opt/theos
          
          # تثبيت الحزم المطلوبة
          sudo apt-get update
          sudo apt-get install -y clang make git perl debianutils
          
          # تحميل Theos في مجلد فريد
          git clone --depth 1 https://github.com/theos/theos /opt/theos
          
          # تحميل الـ SDKs في مسار مختلف تماماً لتجنب التداخل
          sudo mkdir -p /opt/theos/sdks
          git clone --depth 1 https://github.com/theos/sdks.git /opt/theos/sdks
          
          # تحميل أداة dm.pl الضرورية لإنشاء ملفات deb
          sudo curl -L https://raw.githubusercontent.com/theos/theos/master/bin/dm.pl -o /opt/theos/bin/dm.pl
          sudo chmod +x /opt/theos/bin/dm.pl
          
          # إعداد المتغيرات
          echo "THEOS=/opt/theos" >> $GITHUB_ENV
          echo "/opt/theos/bin" >> $GITHUB_PATH

      - name: Compile
        run: |
          export THEOS=/opt/theos
          # الانتقال إلى المجلد الذي يحتوي على الكود الخاص بك
          # تأكد أن المجلد المذكور هنا مطابق تماماً لمجلد مشروعك في الـ Repository
          cd iOS-Simple-IGG-Mod-Menu-main
          
          # تجميع المشروع
          make clean
          make package FINALPACKAGE=1

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: tweak-package
          path: iOS-Simple-IGG-Mod-Menu-main/packages/*.deb
