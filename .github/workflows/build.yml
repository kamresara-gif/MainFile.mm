name: Tweak Cloud Compiler

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Force Clean and Setup
        run: |
          # مسح أي بقايا قديمة من محاولات سابقة
          sudo rm -rf /opt/theos
          sudo mkdir -p /opt/theos
          
          # تثبيت الاعتماديات الأساسية فقط
          sudo apt-get update
          sudo apt-get install -y git build-essential clang
          
          # تحميل Theos يدوياً بدون سكربتات معقدة
          git clone --recursive https://github.com/theos/theos /opt/theos
          
          # تحميل الـ Toolchain يدوياً لضمان عدم حدوث خطأ 128
          git clone https://github.com/theos/toolchain-linux /opt/theos/toolchain/linux
          
          echo "THEOS=/opt/theos" >> $GITHUB_ENV

      - name: Setup SDKs
        run: |
          # مسح مجلد SDKs القديم إذا وجد
          sudo rm -rf /opt/theos/sdks
          sudo mkdir -p /opt/theos/sdks
          # تحميل الـ SDKs
          git clone --depth 1 https://github.com/theos/sdks.git /opt/theos/sdks

      - name: Compile
        run: |
          export THEOS=/opt/theos
          export PATH=$PATH:$THEOS/bin
          # تأكد أن اسم المجلد هنا يطابق اسم المجلد في مستودعك
          # إذا كان المجلد الرئيسي هو نفسه، احذف cd
          cd iOS-Simple-IGG-Mod-Menu-main
          make clean
          make package FINALPACKAGE=1

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: tweak-package
          path: iOS-Simple-IGG-Mod-Menu-main/packages/*.deb
