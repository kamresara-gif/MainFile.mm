name: Tweak Cloud Compiler

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # هذا هو الجزء الذي سألت عنه، قمت بتحديثه ليشمل الحزم المطلوبة
      - name: Setup Environment
        run: |
          sudo apt-get update
          # إضافة perl و debianutils لضمان وجود dm.pl
          sudo apt-get install -y clang make git perl debianutils
          
          sudo mkdir -p /opt/theos
          git clone --depth 1 https://github.com/theos/theos /opt/theos
          
          echo "THEOS=/opt/theos" >> $GITHUB_ENV

      - name: Compile
        run: |
          export THEOS=/opt/theos
          export PATH=$PATH:$THEOS/bin
          # تأكد من اسم المجلد هنا، إذا كان اسم مجلدك مختلفاً قم بتغييره
          cd iOS-Simple-IGG-Mod-Menu-main
          make clean
          make package FINALPACKAGE=1

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: tweak-package
          path: iOS-Simple-IGG-Mod-Menu-main/packages/*.deb
