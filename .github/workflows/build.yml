name: Tweak Cloud Compiler

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Theos Framework
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=/Users/runner/theos" >> $GITHUB_ENV

      - name: Download iOS SDKs
        run: |
          if [ ! -d "/Users/runner/theos/sdks" ]; then
            echo "Cloning SDKs..."
            git clone --depth 1 https://github.com/theos/sdks.git /Users/runner/theos/sdks || \
            (echo "First attempt failed, retrying..." && sleep 5 && git clone --depth 1 https://github.com/theos/sdks.git /Users/runner/theos/sdks)
          else
            echo "SDKs already exist, skipping clone."
          fi

      - name: Compile Tweak Package
        run: |
          export THEOS=/Users/runner/theos
          make clean
          make package FINALPACKAGE=1

      - name: Upload Finished .deb Package
        uses: actions/upload-artifact@v4
        with:
          name: compiled-tweak
          path: packages/*.deb
