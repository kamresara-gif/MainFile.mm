name: Tweak Cloud Compiler

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make git perl debianutils
          
          # إعداد Theos
          sudo mkdir -p /opt/theos
          git clone --depth 1 https://github.com/theos/theos /opt/theos
          
          # الحل الجذري: تحميل ملف dm.pl المفقود يدوياً ووضعه في مساره الصحيح
          sudo mkdir -p /opt/theos/bin
          sudo curl -L https://raw.githubusercontent.com/theos/theos/master/bin/dm.pl -o /opt/theos/bin/dm.pl
          sudo chmod +x /opt/theos/bin/dm.pl
          
          echo "THEOS=/opt/theos" >> $GITHUB_ENV
          echo "/opt/theos/bin" >> $GITHUB_PATH

      - name: Compile
        run: |
          export THEOS=/opt/theos
          cd iOS-Simple-IGG-Mod-Menu-main
          make clean
          make package FINALPACKAGE=1

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: tweak-package
          path: iOS-Simple-IGG-Mod-Menu-main/packages/*.deb
