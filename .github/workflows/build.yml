name: Tweak Cloud Compiler

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Clean and Prepare Environment
        run: |
          # تنظيف قسري للمسارات التي تسبب التضارب
          sudo rm -rf /opt/theos
          sudo mkdir -p /opt/theos
          
          # تثبيت الأدوات الضرورية
          sudo apt-get update
          sudo apt-get install -y clang make git perl debianutils
          
          # تحميل Theos
          git clone --depth 1 https://github.com/theos/theos /opt/theos
          
          # تحميل SDKs مع التحقق من المسار
          sudo mkdir -p /opt/theos/sdks
          git clone --depth 1 https://github.com/theos/sdks.git /opt/theos/sdks
          
          # تحميل dm.pl
          sudo curl -L https://raw.githubusercontent.com/theos/theos/master/bin/dm.pl -o /opt/theos/bin/dm.pl
          sudo chmod +x /opt/theos/bin/dm.pl

      - name: Compile Tweak
        run: |
          export THEOS=/opt/theos
          export PATH=$PATH:$THEOS/bin
          # تأكد أن اسم المجلد بالأسفل يطابق اسم المجلد الحقيقي في مستودعك
          cd iOS-Simple-IGG-Mod-Menu-main
          make clean
          make package FINALPACKAGE=1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tweak-package
          path: iOS-Simple-IGG-Mod-Menu-main/packages/*.deb
