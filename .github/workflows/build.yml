name: Tweak Cloud Compiler

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          # 1. Update and install all necessary dependencies
          sudo apt-get update
          sudo apt-get install -y clang make git perl debianutils build-essential
          
          # 2. Setup Theos in /opt/theos
          sudo mkdir -p /opt/theos
          git clone --depth 1 https://github.com/theos/theos /opt/theos
          
          # 3. Export environment variables
          echo "THEOS=/opt/theos" >> $GITHUB_ENV
          echo "/opt/theos/bin" >> $GITHUB_PATH

      - name: Compile
        run: |
          # Ensure environment variables are active
          export THEOS=/opt/theos
          export PATH=$PATH:$THEOS/bin
          
          # Navigate to project directory
          cd iOS-Simple-IGG-Mod-Menu-main
          
          # Build process
          make clean
          make package FINALPACKAGE=1

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: tweak-package
          path: iOS-Simple-IGG-Mod-Menu-main/packages/*.deb
