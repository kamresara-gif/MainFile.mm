name: Tweak Cloud Compiler

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          # تثبيت المحول البرمجي مباشرة من مستودعات Ubuntu
          sudo apt-get update
          sudo apt-get install -y clang make git
          
          # إعداد هيكل Theos البسيط بدون الحاجة لتحميل الـ Toolchain المعقد
          sudo mkdir -p /opt/theos
          # تحميل النواة فقط
          git clone --depth 1 https://github.com/theos/theos /opt/theos
          
          echo "THEOS=/opt/theos" >> $GITHUB_ENV

      - name: Compile
        run: |
          export THEOS=/opt/theos
          export PATH=$PATH:$THEOS/bin
          # التنقل للمجلد الذي يحتوي على Makefile
          cd iOS-Simple-IGG-Mod-Menu-main
          # استخدام clang المثبت في النظام مباشرة بدلاً من المفقود
          make clean
          make package FINALPACKAGE=1

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: tweak-package
          path: iOS-Simple-IGG-Mod-Menu-main/packages/*.deb
