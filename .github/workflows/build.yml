name: Tweak Cloud Compiler

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential
          git clone --recursive https://github.com/theos/theos /opt/theos
          echo "THEOS=/opt/theos" >> $GITHUB_ENV

      - name: Download iOS SDKs
        run: |
          sudo rm -rf /opt/theos/sdks
          sudo mkdir -p /opt/theos/sdks
          git clone --depth 1 https://github.com/theos/sdks.git /opt/theos/sdks

      - name: Compile Tweak Package
        run: |
          export THEOS=/opt/theos
          export PATH=$PATH:$THEOS/bin
          # Navigate into the subfolder where your Makefile is located
          cd iOS-Simple-IGG-Mod-Menu-main
          make clean
          make package FINALPACKAGE=1

      - name: Upload Finished .deb Package
        uses: actions/upload-artifact@v4
        with:
          name: compiled-tweak
          # Adjusted path to match the subfolder structure
          path: iOS-Simple-IGG-Mod-Menu-main/packages/*.deb
