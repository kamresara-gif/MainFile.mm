name: Tweak Cloud Compiler

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Clean and Setup
        run: |
          # 1. تنظيف شامل وجذري باستخدام أسماء مسارات مختلفة
          sudo rm -rf /opt/theos
          sudo mkdir -p /opt/theos
          
          # 2. تثبيت الحزم المطلوبة
          sudo apt-get update
          sudo apt-get install -y clang make git perl debianutils
          
          # 3. تحميل Theos واستخدام خيار depth 1 لتقليل التضارب
          git clone --depth 1 https://github.com/theos/theos /opt/theos
          
          # 4. تحميل SDKs في مجلد فرعي جديد
          sudo mkdir -p /opt/theos/sdks
          git clone --depth 1 https://github.com/theos/sdks.git /opt/theos/sdks
          
          # 5. تنزيل dm.pl مباشرة لضمان عدم فقده
          sudo curl -L https://raw.githubusercontent.com/theos/theos/master/bin/dm.pl -o /opt/theos/bin/dm.pl
          sudo chmod +x /opt/theos/bin/dm.pl
          
          echo "THEOS=/opt/theos" >> $GITHUB_ENV
          echo "/opt/theos/bin" >> $GITHUB_PATH

      - name: Compile
        run: |
          # التأكد من المتغيرات
          export THEOS=/opt/theos
          
          # الانتقال للمجلد الصحيح
          # تأكد أن اسم المجلد بالأسفل يطابق اسم المجلد في مستودعك
          cd iOS-Simple-IGG-Mod-Menu-main
          
          # التجميع
          make clean
          make package FINALPACKAGE=1

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: tweak-package
          path: iOS-Simple-IGG-Mod-Menu-main/packages/*.deb
